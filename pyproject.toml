[project]
name = "o2a-protocol"
version = "0.1.0"
description = "Reference implementation of O2A (Offers to Agents) Format v0: strict parsing, validation, signing and verification of sponsored blocks."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ivaylo Maksimov", email = "imaks2@illinois.edu" }]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "rfc8785>=0.1.4",
]

[project.optional-dependencies]
http = [
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/o2a_protocol"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["nacl.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["o2a_protocol"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.13",
    "mypy>=2.4.0",
    "pynacl>=1.6.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
